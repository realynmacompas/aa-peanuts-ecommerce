<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Signup Page</title>
  <link rel="stylesheet" href="../CSS/login.css">
</head>

  <body>

  
    <div class="container">

      <img src="../IMG/1e2b3aea-d004-4674-9f39-a064586ce66b-removebg-preview (6).png" alt="logo" class="logo">
      <h6 class="ελκυστικός">ελκυστικός</h6>

      <div class="tab">
        <button id="loginTab" class="active">Login</button>
        <button id="signupTab">Signup</button>
      </div>

      <!-- Login Form -->
              <form id="loginForm" class="form active">
                <div class="form-group">
                  <label for="loginEmail">Email:</label>
                  <input type="email" id="loginEmail" name="loginEmail" placeholder="Enter Your Email" required>
                </div>

                <div class="form-group password-group">
                  <label for="loginPassword">Password:</label>
                  <input type="password" id="loginPassword" name="loginPassword" placeholder="Enter Your Password" required>
                  <img src="../IMG/eye-slash-solid.svg" class="toggle-password" data-target="loginPassword" alt="Toggle Password">
                  
                </div>

              
                <div class="form-actions">
                  <a href="">Forgot Password?</a>
                </div>

                <small id="loginError" class="error"></small>

                
                <button type="submit" id="login">Login</button>
              

              </form>


        <!-- Signup Form -->
            <form action="../PHP/signup.php" method="post" id="signupForm" class="form">
              <div class="form-group">
              
                <label for="signupName">Username:</label>
                <input type="text" id="signupName" name="username" placeholder="Enter Your Username" required autocomplete="off">
                <small class="error" id="usernameError"></small>
              </div>

              <div class="form-group password-group">
                <label for="signupEmail">Email:</label>
                <input type="email" id="signupEmail" name="email" placeholder="Enter Your Email" required autocomplete="off">
                <small class="error" id="emailError"></small>
              </div>

              <div class="form-group password-group signup-pass">
                <label for="signupPassword">Password:</label>               
                <input type="password" id="signupPassword" name="password" placeholder="Create Your Password" required autocomplete="off">           
                <img src="../IMG/eye-slash-solid.svg" class="toggle-password" id="eyeconpass" data-target="signupPassword" alt="Toggle Password">
              </div>
              
              
              <span id="passwordHelp" class="hidden">
                Password must be at least <span id="check-length">❌</span> 8 characters and include 
                <span id="check-uppercase">❌</span> uppercase, 
                <span id="check-lowercase">❌</span> lowercase, 
                <span id="check-number">❌</span> number, and 
                <span id="check-special">❌</span> special character.
              </span><br><br>
            
               
           
              <div class="form-group password-group signup-pass hidden" id="confirmPasswordGroup">
                <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm Password" required> 
                <img src="../IMG/eye-slash-solid.svg" class="toggle-password" data-target="confirm-password" alt="Toggle Password">
                <span id="password-error"></span>

              </div>

            

            <button type="submit" id="signup">Signup</button>
            </form>
    </div>

    
    <a href="../PAGES/public-faqs.html">  
    <div id="faqs-btn">
      <img src="../IMG/message-rounded-dots-solid-24.png" alt="FAQs Button" />
      <span>FAQs</span>
    </div>
    </a>

    <script src="../JS/login.js"></script>

    <div class="cont">
      <footer>
        <h5>&copy; 2025 a&a Peanuts. All rights reserved.</h5>
      </footer>
    </div>


    <div id="successModal" class="modal hidden">
      <div class="modal-content">
        <h2>Signup Successful!</h2>
        <p>You can now login to your account. Thank you!</p>
        <button id="proceedLoginBtn">Login</button>
      </div>
    </div>
    

  </body>


</html>
